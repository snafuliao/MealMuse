# 本地开发数据库：PostgreSQL + pgvector。启动：pnpm dev:db
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mealmuse
      POSTGRES_PASSWORD: mealmuse
      POSTGRES_DB: mealmuse
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mealmuse -d mealmuse']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
