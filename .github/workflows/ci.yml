# 基础门禁（docs/CI.md）：lint / test / build。本项目不是 Tauri，不含打包发布流水线。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript（server / admin-web / shared / harness）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI 文档与服务端代码一致
        run: |
          pnpm openapi
          git diff --exit-code -- apps/server/openapi.json apps/ios/MealMuseKit/Sources/MealMuseAPI/openapi.json \
            || { echo "::error::openapi.json 已过期。修复：本地运行 pnpm openapi 并提交结果。"; exit 1; }

  ios:
    name: iOS（MealMuseKit 测试 + App 构建）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift 格式检查
        run: swift format lint --strict --recursive apps/ios --configuration apps/ios/.swift-format
      - name: MealMuseKit 测试
        run: scripts/ios-test.sh
      - name: 生成 Xcode 工程
        run: |
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
      - name: 构建 App（模拟器，不签名）
        run: |
          xcodebuild build \
            -project apps/ios/MealMuse.xcodeproj \
            -scheme MealMuse \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
