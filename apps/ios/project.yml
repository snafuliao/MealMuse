# XcodeGen 工程描述；生成的 MealMuse.xcodeproj 不入库。生成：xcodegen generate --spec apps/ios/project.yml
name: MealMuse
options:
  bundleIdPrefix: com.mealmuse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
packages:
  MealMuseKit:
    path: MealMuseKit
targets:
  MealMuse:
    type: application
    platform: iOS
    sources:
      - path: MealMuse
    dependencies:
      - package: MealMuseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealmuse.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MealMuse/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MealMuse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          MEALMUSE_SERVER_URL: http://localhost:8787
        Release:
          MEALMUSE_SERVER_URL: https://mealmuse.invalid
